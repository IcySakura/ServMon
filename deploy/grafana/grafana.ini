# SERVMON_ROOT is exported by scripts/run-grafana.sh
[paths]
data = $__env{SERVMON_ROOT}/data/grafana
logs = $__env{SERVMON_ROOT}/data/grafana/log
plugins = $__env{SERVMON_ROOT}/data/grafana/plugins
provisioning = $__env{SERVMON_ROOT}/deploy/grafana/provisioning

[server]
http_addr = 127.0.0.1
http_port = 3300

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false

[auth.anonymous]
enabled = true
org_role = Editor

[security]
admin_user = admin
# change on first login, or set GF_SECURITY_ADMIN_PASSWORD
admin_password = admin

[dashboards]
default_home_dashboard_path = $__env{SERVMON_ROOT}/deploy/grafana/dashboards/01-overview.json
min_refresh_interval = 5s
